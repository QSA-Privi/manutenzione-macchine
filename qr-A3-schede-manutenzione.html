*{box-sizing:border-box;margin:0;padding:0;}

.qr-card{background:#fff;border:1.5px solid #ddd;border-radius:6px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;}
.card-logo{height:18px;}
.qr-box{}
.qr-badge{background:#0e9f6e;color:#fff;font-size:8pt;font-weight:700;padding:2px 7px;border-radius:2px;font-family:monospace;}
.qr-name{font-size:7pt;font-weight:600;color:#222;line-height:1.2;}
@media print{
  @page{size:A3 landscape;margin:8mm;}
  body{background:#fff;}
  .btn-print,.info-box{display:none;}
  .pagina{width:100%;min-height:0;margin:0;padding:8mm;page-break-after:always;}

}

var QR_SIZE = 150;
var PER_PAGE = 21;
var BASE_URL = 'https://qsa-privi.github.io/manutenzione-macchine/scheda.html?m=';

var pagesContainer = document.getElementById('pages');
var totPagine = Math.ceil(MACCHINE.length / PER_PAGE);

for (var p = 0; p < totPagine; p++) {
  var slice = MACCHINE.slice(p * PER_PAGE, p * PER_PAGE + PER_PAGE);

  var pagina = document.createElement('div');
  pagina.className = 'pagina';

  var header = document.createElement('div');
  header.className = 'pag-header';

  var img = document.createElement('img');
  img.className = 'pag-logo';
  img.src = LOGO;
  img.alt = 'Chiarli Modena';

  var title = document.createElement('div');
  title.className = 'pag-title';
  title.textContent = 'QR Code — Schede Manutenzione Macchine';

  var sub = document.createElement('div');
  sub.className = 'pag-sub';
  sub.innerHTML = 'Chiarli 1860 Modena — Linea R80 &nbsp;|&nbsp; Mod. 05-15 &nbsp;|&nbsp; ' + slice[0].code + ' – ' + slice[slice.length - 1].code + ' &nbsp;|&nbsp; Pagina ' + (p + 1) + '/' + totPagine;

  header.appendChild(img);
  header.appendChild(title);
  header.appendChild(sub);
  pagina.appendChild(header);

  var grid = document.createElement('div');
  grid.className = 'grid';

  slice.forEach(function (m) {
    var card = document.createElement('div');
    card.className = 'qr-card';

    var cardLogo = document.createElement('img');
    cardLogo.className = 'card-logo';
    cardLogo.src = LOGO;
    cardLogo.alt = '';

    var qrBox = document.createElement('div');
    qrBox.className = 'qr-box';
    qrBox.id = 'qr-' + m.code;

    var badge = document.createElement('div');
    badge.className = 'qr-badge';
    badge.textContent = m.code;

    var nome = document.createElement('div');
    nome.className = 'qr-name';
    nome.textContent = m.nome;

    card.appendChild(cardLogo);
    card.appendChild(qrBox);
    card.appendChild(badge);
    card.appendChild(nome);
    grid.appendChild(card);
  });

  pagina.appendChild(grid);
  pagesContainer.appendChild(pagina);
}

MACCHINE.forEach(function (m) {
  new QRCode(document.getElementById('qr-' + m.code), {
    text: BASE_URL + m.code,
    width: QR_SIZE,
    height: QR_SIZE,
    colorDark: '#0e9f6e',
    colorLight: '#fff',
    correctLevel: QRCode.CorrectLevel.Q
  });
});
