<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manutenzione Macchine</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--accent:#f5a623;--border:#dee2e6;--muted:#6c757d;--admin:#7c3aed;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'IBM Plex Sans',sans-serif;background:#fff;color:#212529;}
.app-header{background:#fff;border-bottom:3px solid var(--accent);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.06);flex-wrap:wrap;gap:10px;}
.htitle{font-size:1.1rem;font-weight:600;}
.hlinks a{color:var(--muted);text-decoration:none;margin-left:10px;font-size:.8rem;}
.hlinks a:hover{color:var(--accent);}
.main{max-width:700px;margin:0 auto;padding:22px 16px;}
.idx-list{display:flex;flex-direction:column;gap:8px;}
.idx-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:6px;text-decoration:none;color:#212529;}
.idx-item:hover{border-color:var(--accent);}
.idx-badge{background:var(--accent);color:#000;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:4px 9px;border-radius:3px;min-width:38px;text-align:center;}
.idx-name{font-weight:500;font-size:.9rem;}
.idx-sub{font-size:.75rem;color:var(--muted);}
.s-empty{text-align:center;color:var(--muted);font-size:.85rem;padding:32px 0;}
.searchbox{margin-bottom:16px;}
.searchbox input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:.9rem;font-family:inherit;}
</style>
</head>
<body>
<header class="app-header">
  <div class="htitle">🔧 Manutenzione Macchine — Chiarli / Pr.I.V.I.</div>
  <div class="hlinks"><a href="calendario.html">📅 Calendario</a></div>
</header>
<div class="main">
  <div class="searchbox"><input type="text" id="search" placeholder="Cerca macchina o codice..." oninput="filtra()"></div>
  <div class="idx-list" id="list"><div class="s-empty">⏳ Caricamento...</div></div>
</div>
<script>
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLIHbVqB9xQ5BS9lSlxAq3sj7ElzKcRf8y-r4wCU-0ZCrCHuaJVEKSnLtsMxkg_EUmEg/exec";
var TUTTE = [];
function jsonp(params) {
  return new Promise(function (resolve, reject) {
    var cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
    var qs = Object.keys(params).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
    var script = document.createElement('script');
    var done = false;
    window[cbName] = function (data) { done = true; delete window[cbName]; script.remove(); resolve(data); };
    script.src = APPS_SCRIPT_URL + '?' + qs + '&callback=' + cbName;
    script.onerror = function () { if (!done) { reject(new Error('errore')); delete window[cbName]; script.remove(); } };
    document.body.appendChild(script);
    setTimeout(function () { if (!done) { reject(new Error('timeout')); delete window[cbName]; script.remove(); } }, 20000);
  });
}
function esc(s) { return (s === undefined || s === null) ? "" : String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
jsonp({ action: 'read', sheet: 'Macchine' }).then(function (j) {
  TUTTE = (j.rows || []).sort(function (a, b) { return (a.Codice || "").localeCompare(b.Codice || ""); });
  render(TUTTE);
}).catch(function () {
  document.getElementById("list").innerHTML = "<div class='s-empty'>Impossibile contattare il backend.</div>";
});
function render(items) {
  var el = document.getElementById("list");
  if (!items.length) { el.innerHTML = "<div class='s-empty'>Nessuna macchina trovata.</div>"; return; }
  el.innerHTML = items.map(function (m) {
    return "<a class='idx-item' href='scheda.html?m=" + encodeURIComponent(m.Codice) + "'>" +
      "<div class='idx-badge'>" + esc(m.Codice) + "</div>" +
      "<div><div class='idx-name'>" + esc(m.Nome) + "</div><div class='idx-sub'>" + esc(m.Linea ? ("Linea " + m.Linea) : "") + "</div></div>" +
      "</a>";
  }).join("");
}
function filtra() {
  var q = document.getElementById("search").value.toLowerCase();
  render(TUTTE.filter(function (m) { return (m.Codice + " " + m.Nome).toLowerCase().indexOf(q) !== -1; }));
}
</script>
</body>
</html>
